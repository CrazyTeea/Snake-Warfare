map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream php-fpm {
    server app:9000;
}

upstream reverb {
    server reverb:8080;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    # Логи
    access_log /var/log/nginx/snake_access.log;
    error_log  /var/log/nginx/snake_error.log error;

    # Основной маршрут HTTP
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Проксирование WebSocket для Laravel Reverb
    location /app {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Статические файлы
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    # Обработка PHP через PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Блокировка доступа к скрытым файлам (.htaccess, .env и т.д.)
    location ~ /\.ht {
        deny all;
    }
}