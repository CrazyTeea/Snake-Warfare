services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: snake-warfare-app
    container_name: snake_warfare_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - snake_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: snake_warfare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-snake_warfare}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USERNAME:-postgres}", "-d", "${DB_DATABASE:-snake_warfare}" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - snake_network

  redis:
    image: redis:8-alpine
    container_name: snake_warfare_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-secret}' ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - snake_network

  reverb:
    image: snake-warfare-app
    container_name: snake_warfare_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_SERVER_PORT:-8080}:8080"
    volumes:
      - ./:/var/www
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - snake_network

  nginx:
    image: nginx:alpine
    container_name: snake_warfare_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
      - reverb
    networks:
      - snake_network

networks:
  snake_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
